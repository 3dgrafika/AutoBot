name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ta akcja instaluje command-line tools, akceptuje licencje
      # i dodaje sdkmanager do PATH. Pakiety SDK instalujemy w tej samej akcji,
      # aby uniknąć błędu "sdkmanager: command not found".
      - name: Skonfiguruj Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Przygotuj Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sprawdź konfigurację narzędzi
        run: |
          java -version
          gradle --version
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Zbuduj APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Udostępnij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
