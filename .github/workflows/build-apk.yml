name: Build APK

# Buduje aplikację AutoBot na serwerach GitHuba i udostępnia plik APK do pobrania.
#  • push do main/master, pull request  → APK (debug) jako „artefakt” w zakładce Actions
#  • ręczne uruchomienie (Run workflow)  → to samo
#  • tag w formacie v*  (np. v0.3.0)     → dodatkowo publikuje Release z plikiem APK
# Podpisany APK „release” powstaje, gdy w Settings → Secrets są dane klucza (patrz README, sekcja GitHub).

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # potrzebne tylko do utworzenia Release przy tagu

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (z akceptacją licencji)
        uses: android-actions/setup-android@v3

      # Projekt nie zawiera Gradle Wrappera – wersję Gradle wskazujemy tutaj (AGP 8.5.2 wymaga Gradle ≥ 8.7).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Przygotuj klucz podpisu (opcjonalnie)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zbuduj APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Zbuduj APK (release, podpisany)
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nadaj nazwy plików
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoBot-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AutoBot-release.apk
          fi
          ls -la dist

      - name: Wyślij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Opublikuj Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
